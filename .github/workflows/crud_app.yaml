name: CRUD app builder
on:
  push:
    paths:
      - 'example/apps/webapp/**'

jobs:
  irc:
    runs-on: ubuntu-latest
    name: Build CRUD demo app image
    permissions:
      contents: read
    steps:
      - name: checkout
        id: checkout
        uses: actions/checkout@v2
        with:
          submodules: true
      - name: Start PMG proxy
        uses: safedep/pmg@v1
        with:
          server-mode: true
          api-key: ${{ secrets.PMG_PUBLIC_REPOS_TOKEN }}
          tenant-id: ${{ secrets.PMG_TENANT_ID }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1
      - name: Cache Docker layers
        uses: actions/cache@v2
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-
      - name: docker login
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.PUBLIC_DOCKER_USERNAME }}
          password: ${{ secrets.PUBLIC_DOCKER_PASSWORD }}
        # always uses a single image ,the changes are overridden
        # to-do versioning of the builds in case required
      - name: build configurator
        uses: docker/build-push-action@v2
        with:
          tags: razorpay/devstack:crud_demo_app
          push: true
          file: ./example/apps/webapp/Dockerfile
      - name: Enforce PMG policy
        if: always()
        run: pmg proxy stop --fail-on-violation
